apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-vision-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton-vision-app
  template:
    metadata:
      labels:
        app: triton-vision-app
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: sagar27/appforvisonmodel:1.0.2@sha256:c44b37d4b9203b669c9650e88ae72180aaab42696cf1194e0cc94960eec65824
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TRITON_URL
              value: http://triton-server.default.svc.cluster.local:8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: triton-vision-app
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: triton-vision-app
  ports:
    - name: http
      port: 8080
      targetPort: http
