apiVersion: batch/v1
kind: Job
metadata:
  name: triton-perf-analyzer
  namespace: default
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: perf-analyzer
        image: nvcr.io/nvidia/tritonserver:24.01-py3-sdk
        resources:
          requests:
            cpu: "1"
            memory: 512Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: "2"
            memory: 2Gi
            ephemeral-storage: 256Mi
        command:
        - sh
        - -c
        - |
          exec perf_analyzer \
            -m resnet50 \
            -u triton-server:8000 \
            -i http \
            -b 1 \
            --input-data=random \
            --shape data:3,224,224 \
            --concurrency-range 1:32:1 \
            --measurement-interval 6000 \
            -f /tmp/resnet50-perf.csv

  backoffLimit: 0